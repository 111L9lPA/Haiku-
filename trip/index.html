<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отпуск в Китае</title>
  <style>
    :root { --bg:#f2f1f7; --card:#fff; --fg:#1d1a2e; --muted:#6b6785; --accent:#5b3fd4; --accent-fg:#fff; --ok:#1f8f4e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#15122a; --card:#201c3b; --fg:#efecfb; --muted:#a29ec2; --accent:#9b86ff; --accent-fg:#15122a; --ok:#5fd18a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    main { width:100%; max-width:440px; background:var(--card); border-radius:18px; overflow:hidden; }
    #photo { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--bg); }
    .body { padding:20px; display:flex; flex-direction:column; gap:12px; }
    h1 { margin:0; font-size:24px; }
    .price { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; }
    .muted { color:var(--muted); font-size:14px; }
    .days { font-size:20px; }
    button { padding:12px; font:inherit; font-weight:700; border:0; border-radius:10px;
      background:var(--accent); color:var(--accent-fg); cursor:pointer; }
    .bought { color:var(--ok); font-weight:700; }
  </style>
</head>
<body>
<main>
  <img id="photo" alt="" hidden>
  <div class="body">
    <h1 id="title">Москва → Китай</h1>
    <div class="price" id="price">…</div>
    <div class="muted" id="dates"></div>
    <div id="status"></div>
    <div class="days" id="days"></div>
    <button id="toggle" type="button">Отметить: билет куплен</button>
    <div class="muted" id="updated"></div>
  </div>
</main>
<script>
  const URL_ = "https://exmxqybejhbtnbtqcwms.supabase.co";
  const KEY = "sb_publishable_H_c3d5terU1y4slV6t-ChQ_bnfECYM2";
  const H = { apikey: KEY, "Content-Type": "application/json" };
  const $ = (id) => document.getElementById(id);
  let bought = false;

  const rub = (n) => n.toLocaleString("ru-RU") + " ₽";
  const dm = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });

  function renderStatus() {
    $("status").innerHTML = bought ? '<span class="bought">✅ Билет куплен</span>' : "⏳ Билет не куплен";
    $("toggle").textContent = bought ? "Отметить: билет не куплен" : "Отметить: билет куплен";
  }

  fetch("data.json?" + Date.now()).then((r) => r.json()).then((d) => {
    $("title").textContent = "Москва → " + d.destination;
    if (d.best) {
      $("price").textContent = rub(d.best.price) + " туда-обратно";
      $("dates").textContent = "Вылет " + dm(d.best.dep) + ", возврат " + dm(d.best.ret);
    } else {
      $("price").textContent = "Цены пока не найдены";
    }
    if (d.updated_at) $("updated").textContent = "Обновлено: " + new Date(d.updated_at).toLocaleString("ru-RU");
    const left = Math.ceil((new Date(d.trip_start + "T00:00:00") - new Date()) / 864e5);
    $("days").textContent = left > 0 ? "До отпуска: " + left + " дн." : "Отпуск уже начался";
  }).catch(() => { $("price").textContent = "Не удалось загрузить данные"; });

  renderStatus();
  fetch(URL_ + "/rest/v1/trip_state?id=eq.1&select=ticket_bought", { headers: H })
    .then((r) => r.json()).then((rows) => { bought = !!(rows[0] && rows[0].ticket_bought); renderStatus(); })
    .catch(() => {});

  $("toggle").addEventListener("click", () => {
    const next = !bought;
    fetch(URL_ + "/rest/v1/trip_state?id=eq.1", {
      method: "PATCH", headers: { ...H, Prefer: "return=minimal" }, body: JSON.stringify({ ticket_bought: next })
    }).then((r) => { if (r.ok) { bought = next; renderStatus(); } });
  });

  // Случайное фото из ваших загрузок на главной странице сайта (бакет photos)
  fetch(URL_ + "/storage/v1/object/list/photos", {
    method: "POST", headers: H, body: JSON.stringify({ prefix: "", limit: 200 })
  }).then((r) => r.json()).then((items) => {
    const imgs = (Array.isArray(items) ? items : []).filter((i) => i.name && /\.(jpe?g|png|webp)$/i.test(i.name));
    if (!imgs.length) return;
    const pick = imgs[Math.floor(Math.random() * imgs.length)].name;
    $("photo").src = URL_ + "/storage/v1/object/public/photos/" + encodeURIComponent(pick);
    $("photo").hidden = false;
  }).catch(() => {});
</script>
</body>
</html>
