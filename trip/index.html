<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a12">
  <title>Отпуск в Китае</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;600&family=Ma+Shan+Zheng&display=swap">
  <style>
    /* Layout: ночной Пекин. Фото-герой с маршрутом и отсчётом, затем лучшая цена
       и список билетов в виде посадочных талонов. Один тёмный образ по задумке. */
    :root {
      --ink: #0d0a12;
      --ink-2: #17121f;
      --ink-3: #231b2f;
      --paper: #f6efe4;
      --muted: #a99db8;
      --red: #e0372f;
      --red-hot: #ff5a4a;
      --gold: #f4b942;
      --jade: #43c6a5;
      --line: rgba(255, 255, 255, .11);
      --display: "Unbounded", "Arial Black", system-ui, sans-serif;
      --body: "Golos Text", system-ui, sans-serif;
      --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { background: var(--ink); }
    body {
      margin: 0;
      padding-inline: 16px;
      padding-block: 0 48px;
      font-family: var(--body);
      color: var(--paper);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(224, 55, 47, .22), transparent 70%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 28px),
        var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
    h1, h2, p { margin: 0; }

    /* ---------- Герой ---------- */
    .hero {
      position: relative;
      margin-inline: -16px;
      aspect-ratio: 1 / 1;
      max-height: 78vh;
      overflow: hidden;
      border-radius: 0 0 28px 28px;
      isolation: isolate;
    }
    @media (min-width: 640px) { .hero { margin-inline: 0; border-radius: 0 0 28px 28px; } }
    .hero img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      animation: drift 22s ease-in-out infinite alternate;
      z-index: -2;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(13,10,18,.55) 0%, rgba(13,10,18,0) 30%, rgba(13,10,18,.55) 62%, var(--ink) 100%);
    }
    @keyframes drift { from { transform: scale(1.04) translateY(0); } to { transform: scale(1.16) translateY(-2%); } }

    .hero-top { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
    .kanji { font-family: var(--brush); font-size: 44px; line-height: 1; color: var(--gold); text-shadow: 0 2px 18px rgba(0,0,0,.6); animation: rise .9s .1s both; }
    .stamp {
      font-family: var(--display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--paper); border: 1.5px solid rgba(246,239,228,.6); border-radius: 6px; padding: 6px 9px; transform: rotate(4deg);
      background: rgba(13,10,18,.35); backdrop-filter: blur(4px); animation: rise .9s .3s both;
    }
    .hero-bottom { position: absolute; left: 20px; right: 20px; bottom: 22px; display: flex; flex-direction: column; gap: 14px; }

    .route { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 800; animation: rise .9s .35s both; }
    .iata { font-size: clamp(30px, 10vw, 44px); letter-spacing: -.02em; }
    .track { position: relative; flex: 1; height: 24px; }
    .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed rgba(246,239,228,.55); }
    .plane { position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin-top: -11px; color: var(--gold); animation: fly 4.5s ease-in-out infinite; }
    @keyframes fly { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 22px); opacity: 0; } }

    .count { display: flex; align-items: baseline; gap: 10px; animation: rise .9s .5s both; }
    .count b { font-family: var(--display); font-size: clamp(54px, 18vw, 84px); font-weight: 800; line-height: .95; color: var(--paper); font-variant-numeric: tabular-nums; }
    .count span { font-size: 16px; color: var(--muted); line-height: 1.25; }
    .count span em { display: block; font-style: normal; color: var(--gold); font-weight: 600; }

    /* ---------- Лучшая цена ---------- */
    .best {
      position: relative; border-radius: 24px; padding: 22px 20px 20px;
      background: linear-gradient(160deg, var(--ink-3), var(--ink-2));
      border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 14px; overflow: hidden;
      animation: rise .8s .6s both;
    }
    .best::before {
      content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -120px; border-radius: 50%;
      background: radial-gradient(circle, rgba(244,185,66,.28), transparent 65%); pointer-events: none;
    }
    .eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .big { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 12vw, 56px); letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .big small { font-size: .45em; color: var(--muted); font-weight: 500; margin-left: 4px; }
    .meta { color: var(--muted); font-size: 15px; line-height: 1.45; }
    .meta b { color: var(--paper); font-weight: 600; }

    .cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 22px; border-radius: 16px; border: 0; cursor: pointer; text-decoration: none;
      font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: .02em; color: #fff;
      background: linear-gradient(135deg, var(--red-hot), var(--red));
      box-shadow: 0 10px 28px -8px rgba(224,55,47,.7);
      transition: transform .18s, box-shadow .18s;
      position: relative; overflow: hidden;
    }
    .cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); animation: shine 3.8s 1.5s infinite; }
    @keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -8px rgba(224,55,47,.85); }
    .cta:active { transform: translateY(0) scale(.98); }
    .cta[hidden] { display: none; }

    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding-top: 12px; }
    .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(244,185,66,.18); }
    .pill.ok { color: var(--jade); }
    .pill.ok i { background: var(--jade); box-shadow: 0 0 0 4px rgba(67,198,165,.2); }
    .ghost { margin-top: 12px; background: none; border: 1px solid var(--line); color: var(--paper); border-radius: 12px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
    .ghost:hover { border-color: var(--gold); background: rgba(244,185,66,.08); }

    /* ---------- Билеты ---------- */
    .list-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-inline: 4px; }
    h2 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
    .chips { display: flex; gap: 8px; }
    .chip { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: all .2s; }
    .chip[aria-pressed="true"] { color: var(--ink); background: var(--gold); border-color: var(--gold); font-weight: 600; }

    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .ticket {
      position: relative; display: grid; grid-template-columns: 1fr auto; align-items: stretch;
      border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); overflow: hidden;
      opacity: 0; animation: rise .6s calc(var(--i) * 70ms + .75s) both;
      transition: transform .2s, border-color .2s;
    }
    .ticket:hover { transform: translateY(-3px); border-color: rgba(244,185,66,.5); }
    .ticket.first { border-color: rgba(244,185,66,.7); background: linear-gradient(160deg, #2a1f2f, var(--ink-2)); }
    .t-main { padding: 16px 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .t-price { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .t-dates { font-size: 15px; font-weight: 600; }
    .t-sub { font-size: 13px; color: var(--muted); }
    .t-go {
      position: relative; display: flex; align-items: center; justify-content: center; width: 104px; padding: 0;
      border-left: 2px dashed rgba(255,255,255,.16);
      color: var(--ink); background: var(--gold); text-decoration: none;
      font-family: var(--display); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
      transition: background .2s;
    }
    .t-go:hover { background: #ffd069; }
    .ticket::before, .ticket::after {
      content: ""; position: absolute; right: 96px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); z-index: 1;
    }
    .ticket::before { top: -9px; } .ticket::after { bottom: -9px; }
    .flag { position: absolute; top: 12px; right: 120px; font-family: var(--display); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(244,185,66,.6); border-radius: 5px; padding: 3px 6px; }
    .empty { color: var(--muted); text-align: center; padding: 28px 0; }
    .foot { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; padding-inline: 8px; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .ticket { opacity: 1; }
    }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <img src="china.jpg?v=3" alt="Коллаж: Шанхай, Великая стена, фонари Чунцина, скоростной поезд">
    <div class="hero-top">
      <div class="kanji" aria-hidden="true">北京</div>
      <div class="stamp">Отпуск · ноябрь</div>
    </div>
    <div class="hero-bottom">
      <div class="route" aria-label="Москва — Пекин">
        <span class="iata">MOW</span>
        <span class="track">
          <svg class="plane" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>
        </span>
        <span class="iata">PEK</span>
      </div>
      <div class="count">
        <b id="days">…</b>
        <span id="daysLabel">дней до вылета<em id="tripDate"></em></span>
      </div>
    </div>
  </header>

  <section class="best" aria-live="polite">
    <div class="eyebrow">Лучшая цена сейчас</div>
    <div class="big" id="price">…</div>
    <div class="meta" id="bestMeta"></div>
    <a class="cta" id="bestLink" href="#" target="_blank" rel="noopener" hidden>Смотреть билет →</a>
    <div class="status-row">
      <div class="pill" id="status"><i></i><span>Билет не куплен</span></div>
      <button class="ghost" id="toggle" type="button">Отметить: куплен</button>
    </div>
    <div class="meta" id="updated" style="font-size:12px"></div>
  </section>

  <section>
    <div class="list-head">
      <h2>Все билеты</h2>
      <div class="chips" role="group" aria-label="Фильтр">
        <button class="chip" id="chipAll" type="button" aria-pressed="true">Все</button>
        <button class="chip" id="chipDirect" type="button" aria-pressed="false">Без пересадок</button>
      </div>
    </div>
    <ul id="offers" style="margin-top:14px"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>

  <p class="foot">Цены от Aviasales, от дешёвых к дорогим. Перед покупкой они могут измениться. Обновляются автоматически каждые 4 часа.</p>
</main>

<script>
  const URL_ = "https://exmxqybejhbtnbtqcwms.supabase.co";
  const KEY = "sb_publishable_H_c3d5terU1y4slV6t-ChQ_bnfECYM2";
  const H = { apikey: KEY, "Content-Type": "application/json" };
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let bought = false;
  let offers = [];
  let directOnly = false;

  const rub = (n) => n.toLocaleString("ru-RU") + " ₽";
  const dm = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  const short = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace(".", "");
  const stops = (n) => (n == null ? "" : n === 0 ? "без пересадок" : n + " " + (n === 1 ? "пересадка" : "пересадки"));
  const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };

  // ссылка на билет: из API, а если её нет, то поиск на Aviasales по тем же датам
  function link(o) {
    if (o.link) return o.link;
    const ddmm = (iso) => iso.slice(8, 10) + iso.slice(5, 7);
    return "https://www.aviasales.ru/search/MOW" + ddmm(o.dep) + "PEK" + ddmm(o.ret) + "1";
  }

  function countUp(el, to, fmt) {
    if (reduce || to < 1) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 1100;
    const step = (t) => {
      const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function renderStatus() {
    $("status").className = "pill" + (bought ? " ok" : "");
    $("status").lastElementChild.textContent = bought ? "Билет куплен" : "Билет не куплен";
    $("toggle").textContent = bought ? "Снять отметку" : "Отметить: куплен";
  }

  function renderList() {
    const ul = $("offers");
    ul.textContent = "";
    const list = offers.filter((o) => !directOnly || (o.transfers === 0 && !o.return_transfers));
    $("empty").hidden = list.length > 0;
    $("empty").textContent = offers.length ? "Билетов без пересадок не нашлось." : "Цены пока не найдены. Зайдите позже.";
    list.forEach((o, i) => {
      const li = document.createElement("li");
      li.className = "ticket" + (i === 0 ? " first" : "");
      li.style.setProperty("--i", i);

      const main = document.createElement("div");
      main.className = "t-main";
      const price = document.createElement("div");
      price.className = "t-price"; price.textContent = rub(o.price);
      const dates = document.createElement("div");
      dates.className = "t-dates"; dates.textContent = short(o.dep) + " → " + short(o.ret);
      const sub = document.createElement("div");
      sub.className = "t-sub";
      sub.textContent = [o.airline, stops(o.transfers)].filter(Boolean).join(" · ") || "Туда-обратно";
      main.append(price, dates, sub);

      const go = document.createElement("a");
      go.className = "t-go"; go.href = link(o); go.target = "_blank"; go.rel = "noopener";
      go.textContent = "Выбрать";
      go.setAttribute("aria-label", "Выбрать билет за " + rub(o.price));

      li.append(main, go);
      if (i === 0) {
        const f = document.createElement("div");
        f.className = "flag"; f.textContent = "Дешевле всех";
        li.appendChild(f);
      }
      ul.appendChild(li);
    });
  }

  function setDirect(v) {
    directOnly = v;
    $("chipAll").setAttribute("aria-pressed", String(!v));
    $("chipDirect").setAttribute("aria-pressed", String(v));
    renderList();
  }
  $("chipAll").addEventListener("click", () => setDirect(false));
  $("chipDirect").addEventListener("click", () => setDirect(true));

  fetch("data.json?" + Date.now()).then((r) => r.json()).then((d) => {
    offers = (d.offers || (d.best ? [d.best] : [])).slice().sort((a, b) => a.price - b.price);

    const left = Math.max(Math.ceil((new Date(d.trip_start + "T00:00:00") - new Date()) / 864e5), 0);
    countUp($("days"), left, String);
    $("daysLabel").firstChild.textContent = plural(left, "день", "дня", "дней") + " до вылета";
    $("tripDate").textContent = dm(d.trip_start);

    if (offers.length) {
      const b = offers[0];
      countUp($("price"), b.price, (n) => rub(n));
      $("bestMeta").innerHTML = "Вылет <b></b>, возврат <b></b>";
      const bs = $("bestMeta").querySelectorAll("b");
      bs[0].textContent = dm(b.dep); bs[1].textContent = dm(b.ret);
      $("bestLink").href = link(b);
      $("bestLink").hidden = false;
    } else {
      $("price").textContent = "Цены ищутся";
      $("bestMeta").textContent = "Первые цены появятся после ближайшего обновления.";
    }
    if (d.updated_at) $("updated").textContent = "Обновлено: " + new Date(d.updated_at).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    renderList();
  }).catch(() => {
    $("price").textContent = "Нет данных";
    $("bestMeta").textContent = "Не удалось загрузить цены. Обновите страницу.";
  });

  renderStatus();
  fetch(URL_ + "/rest/v1/trip_state?id=eq.1&select=ticket_bought", { headers: H })
    .then((r) => r.json()).then((rows) => { bought = !!(rows[0] && rows[0].ticket_bought); renderStatus(); })
    .catch(() => {});

  $("toggle").addEventListener("click", () => {
    const next = !bought;
    fetch(URL_ + "/rest/v1/trip_state?id=eq.1", {
      method: "PATCH", headers: { ...H, Prefer: "return=minimal" }, body: JSON.stringify({ ticket_bought: next })
    }).then((r) => { if (r.ok) { bought = next; renderStatus(); } });
  });
</script>
</body>
</html>
