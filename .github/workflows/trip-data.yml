name: Update trip prices

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch prices
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python trip-bot/update_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip/data.json
          git diff --staged --quiet || (git commit -m "Update trip prices" && git push)
