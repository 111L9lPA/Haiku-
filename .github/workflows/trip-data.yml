name: Update trip prices

# Каждые 5 минут быстрая проверка (пара секунд): нажали ли «Обновить» на сайте,
# написали ли боту, не устарели ли данные (старше 4 часов). Тяжёлая часть запускается только при необходимости.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trip-update
  cancel-in-progress: false

env:
  SB_URL: https://exmxqybejhbtnbtqcwms.supabase.co
  # Публичный (publishable) ключ Supabase: его безопасно хранить в коде.
  SB_KEY: sb_publishable_H_c3d5terU1y4slV6t-ChQ_bnfECYM2

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check what to do
        id: check
        env:
          EVENT: ${{ github.event_name }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python3 trip-bot/check.py

      - name: Clear refresh request
        if: steps.check.outputs.flag == 'true'
        run: |
          curl -sS -X PATCH "$SB_URL/rest/v1/trip_state?id=eq.1" \
            -H "apikey: $SB_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"refresh_requested":false}'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.prices == 'true' || steps.check.outputs.bot == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.check.outputs.prices == 'true' || steps.check.outputs.bot == 'true'
        run: pip install requests

      - name: Fetch prices
        if: steps.check.outputs.prices == 'true'
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python trip-bot/update_data.py

      - name: Telegram
        if: steps.check.outputs.prices == 'true' || steps.check.outputs.bot == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PRICES_UPDATED: ${{ steps.check.outputs.prices }}
        run: python trip-bot/telegram_update.py

      - name: Commit data
        if: steps.check.outputs.prices == 'true' || steps.check.outputs.bot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trip
          if ! git diff --staged --quiet; then
            git commit -m "Update trip prices"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
