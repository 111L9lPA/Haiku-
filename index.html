<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини сайт</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 16px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      text-align: center;
    }
    p { margin: 0; font-size: 20px; font-variant-numeric: tabular-nums; }
    button {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #764ba2;
      cursor: pointer;
      transition: transform .15s;
    }
    button:hover { transform: scale(1.05); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <h1>Привет! 👋</h1>
  <p id="count">Всего нажатий: …</p>
  <button id="btn">Нажми меня</button>
  <script>
    // Публичный (publishable) ключ Supabase: безопасно хранить в коде.
    // Доступ ограничен правилами RLS в базе.
    const URL_ = "https://exmxqybejhbtnbtqcwms.supabase.co";
    const KEY = "sb_publishable_H_c3d5terU1y4slV6t-ChQ_bnfECYM2";
    const headers = { apikey: KEY, "Content-Type": "application/json" };
    const countEl = document.getElementById("count");
    const btn = document.getElementById("btn");

    const show = (n) => { countEl.textContent = "Всего нажатий: " + n; };
    const fail = () => { countEl.textContent = "Не удалось связаться с базой"; };

    fetch(URL_ + "/rest/v1/clicks?id=eq.1&select=total", { headers })
      .then((r) => r.json())
      .then((rows) => show(rows[0].total))
      .catch(fail);

    btn.addEventListener("click", () => {
      btn.disabled = true;
      fetch(URL_ + "/rest/v1/rpc/add_click", { method: "POST", headers, body: "{}" })
        .then((r) => r.json())
        .then(show)
        .catch(fail)
        .finally(() => { btn.disabled = false; });
    });
  </script>
</body>
</html>
