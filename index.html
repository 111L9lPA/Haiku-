<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини сайт</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 16px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      background-attachment: fixed;
      color: #fff;
      text-align: center;
    }
    h1, h2, p { margin: 0; }
    p { font-size: 20px; font-variant-numeric: tabular-nums; }
    button, .upload {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #764ba2;
      cursor: pointer;
      transition: transform .15s;
    }
    button:hover, .upload:hover { transform: scale(1.05); }
    button:active, .upload:active { transform: scale(0.97); }
    button:disabled { opacity: .6; cursor: default; }
    section { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .upload input { display: none; }
    #status { font-size: 16px; min-height: 1.2em; }
    #gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    #gallery a {
      display: block;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, .15);
    }
    #gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <h1>Привет! 👋</h1>

  <section>
    <p id="count">Всего нажатий: …</p>
    <button id="btn">Нажми меня</button>
  </section>

  <section>
    <h2>Фото</h2>
    <label class="upload">
      Загрузить фото
      <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
    </label>
    <div id="status"></div>
    <div id="gallery"></div>
  </section>

  <script>
    // Публичный (publishable) ключ Supabase: безопасно хранить в коде.
    // Доступ ограничен правилами в базе.
    const URL_ = "https://exmxqybejhbtnbtqcwms.supabase.co";
    const KEY = "sb_publishable_H_c3d5terU1y4slV6t-ChQ_bnfECYM2";
    const headers = { apikey: KEY, "Content-Type": "application/json" };

    // ---- Счётчик ----
    const countEl = document.getElementById("count");
    const btn = document.getElementById("btn");
    const show = (n) => { countEl.textContent = "Всего нажатий: " + n; };
    const fail = () => { countEl.textContent = "Не удалось связаться с базой"; };

    fetch(URL_ + "/rest/v1/clicks?id=eq.1&select=total", { headers })
      .then((r) => r.json())
      .then((rows) => show(rows[0].total))
      .catch(fail);

    btn.addEventListener("click", () => {
      btn.disabled = true;
      fetch(URL_ + "/rest/v1/rpc/add_click", { method: "POST", headers, body: "{}" })
        .then((r) => r.json())
        .then(show)
        .catch(fail)
        .finally(() => { btn.disabled = false; });
    });

    // ---- Фото ----
    const gallery = document.getElementById("gallery");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const publicUrl = (name) => URL_ + "/storage/v1/object/public/photos/" + encodeURIComponent(name);

    function loadPhotos() {
      fetch(URL_ + "/storage/v1/object/list/photos", {
        method: "POST",
        headers,
        body: JSON.stringify({ prefix: "", limit: 100, sortBy: { column: "created_at", order: "desc" } })
      })
        .then((r) => r.json())
        .then((items) => {
          gallery.textContent = "";
          if (!Array.isArray(items)) throw new Error("bad response");
          items.filter((i) => i.name && i.id).forEach((i) => {
            const a = document.createElement("a");
            a.href = publicUrl(i.name);
            a.target = "_blank";
            a.rel = "noopener";
            const img = document.createElement("img");
            img.src = publicUrl(i.name);
            img.loading = "lazy";
            img.alt = "";
            a.appendChild(img);
            gallery.appendChild(a);
          });
        })
        .catch(() => { statusEl.textContent = "Не удалось загрузить список фото"; });
    }

    fileInput.addEventListener("change", async () => {
      const files = Array.from(fileInput.files);
      let ok = 0;
      for (const [i, f] of files.entries()) {
        statusEl.textContent = "Загрузка " + (i + 1) + " из " + files.length + "…";
        const ext = (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const name = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
        try {
          const r = await fetch(URL_ + "/storage/v1/object/photos/" + name, {
            method: "POST",
            headers: { apikey: KEY, "Content-Type": f.type, "x-upsert": "false" },
            body: f
          });
          if (r.ok) ok++;
        } catch (e) { /* считаем как неудачу */ }
      }
      statusEl.textContent = ok === files.length
        ? "Готово: загружено " + ok
        : "Загружено " + ok + " из " + files.length + ". Файл должен быть фото до 10 МБ.";
      fileInput.value = "";
      loadPhotos();
    });

    loadPhotos();
  </script>
</body>
</html>
